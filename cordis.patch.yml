# ============================================================================
# dsh-memory-vault 的挂载声明
# ============================================================================
#
# 这个文件让 dsh 把本插件挂进配置树。
# - id：插件行标识（唯一）
# - name：模块名，解析到本包的 index.js（宿主半侧）
#
# 安装后 dsh 会自动把本包加入 profile 的 bundles 列表；无需手动编辑
# profile 下的 cordis.patch.yml。
#
# ============================================================================

- insert:
    - id: memory-vault
      name: 'dsh-memory-vault'
